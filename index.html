<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Labyrinth</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .win-overlay, .lose-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.2/pixi.min.js"></script>
</head>
<body>
    <div class="game-container">
        <div id="torchIndicator"></div>
        <div class="counters">
            <div id="stepCounter">Steps: 0</div>
            <div id="uniqueTilesCounter">Unique Tiles: 0</div>
            <div id="keyCounter">Keys: 0</div>
            <div id="spoolCounter">Spool: 0</div>
            <div id="compassIndicator">Compass: 0°</div>
            <div id="shieldCounter">Shield: 0</div>
            <div id="minotaurRadar">Minotaur Radar: 0</div>
            <div id="dashCounter">Dash: 0</div>
            <div id="recallCounter">Recall: 0</div>
            <div id="breachCounter">Breach: 0</div>
            <div id="flareCounter">Flare: 0</div>
            <div id="decoyCounter">Decoy: 0</div>
            <div id="owlCounter">Owl: 0</div>
            <div id="tridentCounter">Trident: 0</div>
            <div id="arrowCounter">Arrow: 0</div>
            <div id="chariotCounter">Chariot: 0</div>
            <div id="anvilCounter">Anvil: 0</div>
        </div>
        <div class="ability-controls">
            <button id="useSpoolButton" class="ability-btn">Use Spool</button>
            <button id="repelButton" class="ability-btn">Repel</button>
            <button id="dashButton" class="ability-btn">Dash</button>
            <button id="recallButton" class="ability-btn">Recall</button>
            <button id="breachButton" class="ability-btn">Breach</button>
            <button id="flareButton" class="ability-btn">Flare</button>
            <button id="decoyButton" class="ability-btn">Decoy</button>
            <button id="owlButton" class="ability-btn">Owl</button>
            <button id="tridentButton" class="ability-btn">Trident</button>
            <button id="arrowButton" class="ability-btn">Arrow</button>
            <button id="chariotButton" class="ability-btn">Chariot</button>
            <button id="anvilButton" class="ability-btn">Anvil</button>
        </div>
        <canvas id="gameCanvas" width="800" height="800" tabindex="0"></canvas>
        <div id="winOverlay" class="win-overlay" style="display: none; position: fixed; z-index: 1000;">You Escaped!</div>
        <div id="loseOverlay" class="lose-overlay" style="display: none; position: fixed; z-index: 1000;"><div>Game Over!<br><button id="resetButton" type="button">Play Again</button></div></div>
        <div class="camera-controls">
            <div id="centerCameraButton" class="camera-btn">Center Camera</div>
            <div id="edgeCameraButton" class="camera-btn">Edge Camera</div>
            <button id="toggleViewButton" class="camera-btn" type="button">View: 3D + Minimap (M)</button>
        </div>
        <div class="mobile-controls">
            <button class="mobile-btn" data-direction="up">↑</button>
            <button class="mobile-btn" data-direction="left">←</button>
            <button class="mobile-btn" data-direction="down">↓</button>
            <button class="mobile-btn" data-direction="right">→</button>
        </div>
    </div>

    <script src="mazeShrinePlacement.js"></script>
    <script src="mazeAdvancedShrinePlacement.js"></script>
    <script src="mazeWorld.js"></script>
    <script src="mazeMobilityAbilities.js"></script>
    <script src="mazeMinotaurAI.js"></script>
    <script src="mazeAbilities.js"></script>
    <script src="mazeHUD.js"></script>
    <script src="mazeOverheadRenderer.js"></script>
    <script src="mazeFirstPersonRenderer.js"></script>
    <script src="mazeCanvasRenderer.js"></script>
    <script src="mazeRenderer.js"></script>
    <script src="mazeMobileControls.js"></script>
    <script src="mazeGameInit.js"></script>
    <script src="mazeController.js"></script>
    <script src="mazeThreadDiagnostics.js"></script>
    <script src="mazeDecoyDiagnostics.js"></script>
    <script src="mazeEnvironmentProbe.js"></script>
    <script src="mazeIntegrationSmokeSpec.js"></script>
    <script src="mazeIntegrationDiagnostics.js"></script>
    <script src="mazeApp.js"></script>
</body>
</html>
