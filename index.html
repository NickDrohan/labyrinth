<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Labyrinth</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.2/pixi.min.js"></script>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    <div id="uniqueTilesCounter" class="counter">Unique tiles: 0</div>
    <div id="keyCounter" class="counter">Keys: 0</div>
    <div id="stepCounter" class="counter">Steps: 0</div>
    <div id="torchIndicator" class="counter">Torch: 0</div>
    <div id="legend" class="legend">Gold keys open blue gates
    <span class="secret-passage-icon">🌀</span> Secret passages: Swirling purple portals that teleport you to a distant location</div>
    <div id="winOverlay" class="win-overlay" style="display: none;">
        You Escaped! Steps: 0
    </div>

    <div id="loseOverlay" class="lose-overlay" style="display: none;">
        You were caught!
        <button id="resetButton">Restart</button>
    </div>

    <div id="centerCameraButton" class="camera-btn">Center Camera</div>
    <div id="edgeCameraButton" class="camera-btn">Edge Camera</div>

    <div class="mobile-controls">
        <button class="mobile-btn" data-direction="up">↑</button>
        <button class="mobile-btn" data-direction="left">←</button>
        <button class="mobile-btn" data-direction="down">↓</button>
        <button class="mobile-btn" data-direction="right">→</button>
    </div>
</div>

<script src="mazeApp.js"></script>
</body>
</html>
