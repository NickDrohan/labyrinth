# fly.toml app configuration file generated for labyrinth on 2025-04-08T04:58:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'labyrinth'
primary_region = 'iad'

[build]
builder = 'paketobuildpacks/builder-jammy-base'
buildpacks = ['gcr.io/paketo-buildpacks/web-servers']

[env]
PORT = '8080'
BP_WEB_SERVER = 'httpd'
BP_WEB_SERVER_ROOT = '.'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
